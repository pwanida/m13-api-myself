<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Power Up! Portfolio (server version)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar py-3">
        <div class="container">
            <span class="fw-bold fs-5">✦ Power Up!</span>
            <span class="small text-muted">Saved on the server — open it on any device.</span>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="row g-4">
            <!-- LEFT: list of Portfolios + create form -->
            <section class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h2 class="h5 fw-bold">Portfolios</h2>
                    <div id="portfolio-list" class="d-grid gap-2"></div>
                    <p id="list-empty" class="small text-muted mb-0">No Portfolios yet.</p>
                </div>
                <div class="form-panel rounded-4 p-4">
                    <h2 class="h5 fw-bold">Create a Portfolio</h2>
                    <form id="portfolio-form">
                        <label class="form-label" for="displayName">Display name *</label>
                        <input class="form-control mb-2" id="displayName" name="displayName" maxlength="80" required>
                        <label class="form-label" for="enjoy">What I enjoy</label>
                        <input class="form-control mb-2" id="enjoy" name="whatIEnjoy">
                        <label class="form-label" for="tried">What I've tried</label>
                        <input class="form-control mb-2" id="tried" name="whatIveTried">
                        <label class="form-label" for="curious">What I'm curious about</label>
                        <input class="form-control mb-2" id="curious" name="whatImCuriousAbout">
                        <p class="form-error small mb-2" id="portfolio-error" role="alert"></p>
                        <button class="btn btn-success w-100" type="submit">Create Portfolio</button>
                    </form>
                </div>
            </section>

            <!-- RIGHT: selected Portfolio, its Items, add-Item form -->
            <section class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h2 class="h4 fw-bold" id="portfolio-name">Choose a Portfolio</h2>
                    <p class="mb-1"><strong>What I enjoy:</strong> <span id="portfolio-enjoy"></span></p>
                    <p class="mb-1"><strong>What I've tried:</strong> <span id="portfolio-tried"></span></p>
                    <p><strong>What I'm curious about:</strong> <span id="portfolio-curious"></span></p>
                    <div id="item-list" class="d-grid gap-3"></div>
                </div>

                <div class="form-panel rounded-4 p-4">
                    <h2 class="h5 fw-bold">Add a Portfolio Item</h2>
                    <form id="item-form">
                        <div class="row g-2">
                            <div class="col-md-6"><label class="form-label" for="title">Title *</label><input class="form-control" id="title" name="title" required></div>
                            <div class="col-md-3"><label class="form-label" for="type">Type</label><input class="form-control" id="type" name="type" placeholder="Project"></div>
                            <div class="col-md-3"><label class="form-label" for="date">Date</label><input class="form-control" id="date" name="date" type="date"></div>
                            <div class="col-md-6"><label class="form-label" for="role">Role</label><input class="form-control" id="role" name="role"></div>
                            <div class="col-md-6"><label class="form-label" for="skills">Skills (comma separated)</label><input class="form-control" id="skills" name="skills" placeholder="HTML, CSS"></div>
                            <div class="col-12"><label class="form-label" for="description">Description</label><input class="form-control" id="description" name="description"></div>
                            <div class="col-md-6"><label class="form-label" for="whatIDid">What I did</label><input class="form-control" id="whatIDid" name="whatIDid"></div>
                            <div class="col-md-6"><label class="form-label" for="whatILearned">What I learned</label><input class="form-control" id="whatILearned" name="whatILearned"></div>
                            <div class="col-md-6"><label class="form-label" for="challenge">Challenge</label><input class="form-control" id="challenge" name="challenge"></div>
                            <div class="col-md-6"><label class="form-label" for="nextStep">Next step</label><input class="form-control" id="nextStep" name="nextStep"></div>
                            <div class="col-12"><label class="form-label" for="evidence">Evidence link</label><input class="form-control" id="evidence" name="evidence" type="url" placeholder="https://..."></div>
                        </div>
                        <p class="form-error small my-2" id="item-error" role="alert"></p>
                        <button class="btn btn-success w-100" type="submit">Add Item</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
